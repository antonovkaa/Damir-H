<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>JS Bin</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>

<header>
    <div class="text_header"> HAPPY <br> HELLOWEEN </div>
</header>

<main>
<div class="text_main"> THIS DAY </div>

<hr  width=400px size=1px color="brown" />

<div class="text_main2">Halloween is on October 31. People wear funny or scary costumes. Children go from house to house and say, “Trick or treat!” People decorate their homes with pumpkins, ghosts, and spiders. Halloween is a fun and spooky holiday! </div>

<div class="container">
    <div class="box-1"></div>        
    <div class="box-2"></div>
    <div class="box-3"></div>
</div>

</main>

<button id="halloweenButton">🎃 LET IT RAIN!</button>

<div id="emojiContainer"></div>
<script src="script.js">

let button = document.getElementById("halloweenButton");
let container = document.getElementById("emojiContainer");

button.onclick = function() {
    let emojis = ["🎃", "👻", "🦇", "🍬", "💀", "🕷","🔪"];

    for (let i = 0; i < 40; i++) {
        let emoji = document.createElement("div");

        emoji.className = "falling-emoji";
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.left = Math.random() * 100 + "%";
        emoji.style.fontSize = (20 + Math.random() * 30) + "px";
        emoji.style.animationDuration = (2 + Math.random() * 3) + "s";
        emoji.style.animationDelay = Math.random() * 2 + "s";

        container.appendChild(emoji);

        emoji.addEventListener("animationend", function() {
            emoji.remove();
        });
    }
};

  
</script>
</body>
</html>

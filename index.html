<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>JS Bin</title>
 
  <style>

body{
  background-color: rgb(237, 191, 135);
}

header {
background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9tx8in3sbEF2D-GxlVRGeuXD7droHx7XzzFj2wHZ5EA&s=10");
background-size: cover;
background-position: center;
height: 300px;
}

.text_header{
color:orange ;
text-align:center;
font-size:10opx;
font-style: italic;
font-family:Georgia, 'Times New Roman', Times, serif;
padding-top:10px;
}

.text_main {
color: lightyellow;
text-align: center;
font-size:50px;
font-family:Georgia, 'Times New Roman', Times, serif;
padding-top:20px;
font-weight: 200;
}
.text_main2 {
  color: rgb(220,10,90);
  text-align: center;
  font-size:25px;
  font-family:Georgia, 'Times New Roman', Times, serif;
  padding-top:20px;
  font-weight: 900;
  text-align: center;
  }
  .container {
  display: flex;
  justify-content: center;  
 
}
.container div {
  padding:10px;
  background-color: rgb(196, 120, 19);
  text-align: center;
  background-size: cover;
  background-position: center;
}
.box-1 {
     width:40%;
     background-image: url("https://static.boredpanda.com/blog/wp-content/uploads/2024/10/50-halloween-memes-that-are-freakishly-hilarious-cover_675.jpg   ");
     height: 400px;
     margin: 50px;
   
}
.box-2 {
     width:40%;
     background-image: url("   https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIW8Lbq__2ADapa-L6f-NpdlcyNWKD3dRJw2-AHWPnkA&s=10zz");
     height: 400px;
     margin: 50px;
   
  
  
  
  
}#halloweenButton {
    display: block;
    margin: 30px auto;
    padding: 15px 30px;
    background-color: rgb(76, 21, 4);
    color: orange;
    font-size: 20px;
    border: 2px solid orange;
    border-radius: 10px;
    cursor: pointer;
}

#emojiContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1000;
}
    </style>
</head>
<body>

<header>
    <div class="text_header"> HAPPY <br> HELLOWEEN </div>
</header>

<main>
<div class="text_main"> THIS DAY </div>

<hr  width=400px size=1px color="brown" />

<div class="text_main2">Halloween is on October 31. People wear funny or scary costumes. Children go from house to house and say, “Trick or treat!” People decorate their homes with pumpkins, ghosts, and spiders. Halloween is a fun and spooky holiday! </div>

<div class="container">
    <div class="box-1"></div>        
    <div class="box-2"></div>
    <div class="box-3"></div>
</div>

</main>

<button id="halloweenButton">🎃 LET IT RAIN!</button>

<div id="emojiContainer"></div>
<script src="script.js">

let button = document.getElementById("halloweenButton");
let container = document.getElementById("emojiContainer");

button.onclick = function() {
    let emojis = ["🎃", "👻", "🦇", "🍬", "💀", "🕷","🔪"];

    for (let i = 0; i < 40; i++) {
        let emoji = document.createElement("div");

        emoji.className = "falling-emoji";
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.left = Math.random() * 100 + "%";
        emoji.style.fontSize = (20 + Math.random() * 30) + "px";
        emoji.style.animationDuration = (2 + Math.random() * 3) + "s";
        emoji.style.animationDelay = Math.random() * 2 + "s";

        container.appendChild(emoji);

        emoji.addEventListener("animationend", function() {
            emoji.remove();
        });
    }
};

  
</script>
</body>
</html>
